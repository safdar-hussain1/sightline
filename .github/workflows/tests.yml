# Both suites, on every push to main and every pull request against it.
#
# What this does not run, on purpose, and why:
#
# - No dataset and no trained runs. data/ (the recorded drives) and runs/
#   (checkpoints and frame caches) are git-ignored, so a checkout has
#   neither. The engine's tests build small synthetic drives and train on
#   them on the CPU; the tests that need the real drives or the run folders
#   skip with a stated reason or check only what the committed reports hold,
#   and every published number is checked against those reports.
# - No standard-recipe weights. They are not part of the repository, so the
#   test that checks the PyTorch port against them skips unless
#   SIGHTLINE_LEGACY_WEIGHTS names them; the port is still checked on seeded
#   random weights.
# - No GPU. Everything runs on the CPU, with PyTorch's CPU wheel: the default
#   wheel brings gigabytes of CUDA libraries that nothing here uses.
# - No browser. The page's tests run in Vitest (happy-dom), and the published
#   models run in Node through the page's own onnxruntime-web build, on the
#   self-test inputs. The page's selftest in a real browser runs in headless
#   Chrome through scripts/verify_page.sh, outside this workflow.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # The full history: the authorship test reads every commit, and refuses a
      # shallow clone, which holds only some of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python loads libGL when it is imported. GitHub's Ubuntu image
      # ships it; the install only runs if that ever stops being true.
      - name: OpenCV system library
        run: |
          if ! ldconfig -p | grep 'libGL\.so\.1' > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y libgl1
          fi

      # The site-data tests encode the demo clips with ffmpeg and read them back
      # with ffprobe, as `sightline site-data` does for the page. Without them
      # that path would skip, so ffmpeg is installed from Ubuntu's own archive
      # when the image does not already have it.
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -rs

  web:
    name: web (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: web
    steps:
      # The tip alone: this job compares the built docs/ with the checkout,
      # and reads no history.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Includes the Node-side parity test: both published models, run by the
      # page's own runtime, against the outputs onnxruntime gave in Python.
      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      # Also writes docs/build-manifest.json, a digest of every file the build
      # read and wrote.
      - name: Build
        run: npm run build

      # The site in docs/ is committed, so it must be exactly what the build
      # produces from the committed sources: nothing changed, nothing missing,
      # nothing extra.
      - name: The build reproduces the committed docs/
        run: |
          changes="$(git status --porcelain -- ../docs)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "docs/ is not what npm run build produces from the committed sources."
            exit 1
          fi
