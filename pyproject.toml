[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sightline"
version = "1.0.0"
description = "Vision-based steering engine with an honest evaluation protocol and in-browser cockpit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Safdar Hussain", email = "safdar.eryx@gmail.com" }]
keywords = ["steering-angle-prediction", "behavioral-cloning", "self-driving", "computer-vision", "pytorch", "onnx", "saliency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "torch>=2.4,<2.16",
    "tqdm>=4.66,<5",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
export = [
    "onnx>=1.15,<2",
    "onnxruntime>=1.17,<2",
]
figures = [
    "matplotlib>=3.8,<4",
]
# running the narrative notebooks: Jupyter's executor and kernel, and the figures they draw
notebooks = [
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<8",
    "matplotlib>=3.8,<4",
]
dev = [
    "pytest>=8,<10",
    "onnx>=1.15,<2",
    "onnxruntime>=1.17,<2",
    "matplotlib>=3.8,<4",
]

[project.scripts]
sightline = "sightline.cli:main"

[project.urls]
Homepage = "https://safdar-hussain1.github.io/sightline/"
Repository = "https://github.com/safdar-hussain1/sightline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
